<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>霓虹镜像绘制</title><style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#030204;color:#fff;font-family:ui-monospace,monospace}main,canvas{position:absolute;inset:0;width:100%;height:100%}.code{position:absolute;inset:-40% 7%;opacity:.34;color:#77566f;font-size:11px;line-height:22px;white-space:pre;animation:scroll 26s linear infinite}.shade{position:absolute;inset:0;background:radial-gradient(circle,#18051122,#020203cc 78%)}canvas{touch-action:none;cursor:crosshair}.axis{position:absolute;left:50%;top:7%;bottom:12%;width:1px;background:linear-gradient(transparent,#ff2cac44,transparent)}.tools{position:absolute;z-index:3;right:26px;bottom:22px;display:flex;gap:8px}.tools button{height:40px;padding:0 17px;border:1px solid #442b39;border-radius:999px;background:#120a10cc;color:#bc91ab;cursor:pointer}.tools .on{color:#fff;border-color:#d71b91;background:#79114e99}.hint{position:absolute;z-index:2;left:50%;bottom:35px;transform:translateX(-50%);color:#806173;font-size:10px;pointer-events:none}@keyframes scroll{to{transform:translateY(-33%)}}@media(max-width:640px){.tools{right:50%;transform:translateX(50%)}.hint{bottom:78px}.code{font-size:9px;line-height:18px}}
</style></head><body><main><pre class="code" id="code"></pre><div class="shade"></div><div class="axis" id="axis"></div><canvas id="c"></canvas><div class="hint" id="hint">按住并拖拽 · 自动镜像绘制</div><div class="tools"><button id="mode" class="on">镜像开启</button><button id="clear">清空画布</button></div></main><script>
const py=`import math, random\n\ndef mirror(point, axis_x):\n    x, y = point\n    return axis_x * 2 - x, y\n\ndef smooth_curve(points):\n    return chaikin(points, passes=2)\n\nwhile running:\n    if pointer.dragging:\n        trail.add(pointer.position)\n        particles.emit(pointer.position)\n    render_neon_layer(trail, particles)\n`;code.textContent=(py+'\n').repeat(14);
const c=document.querySelector('#c'),x=c.getContext('2d'),mode=document.querySelector('#mode'),axis=document.querySelector('#axis'),hint=document.querySelector('#hint');let W,H,D,mirror=true,down=false,last=null,paths=[],current=[],parts=[];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function pos(e){return{x:e.clientX,y:e.clientY}}function smooth(a){if(a.length<3)return a;let b=[a[0]];for(let i=0;i<a.length-1;i++){let p=a[i],q=a[i+1];b.push({x:p.x*.75+q.x*.25,y:p.y*.75+q.y*.25},{x:p.x*.25+q.x*.75,y:p.y*.25+q.y*.75})}b.push(a.at(-1));return b}
function emit(p,n=8,blast=false,m=mirror){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=(blast?1.5:.3)+Math.random()*(blast?5:2),q={x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:40+Math.random()*50,size:.6+Math.random()*3,h:Math.random()>.25?325:292};parts.push(q);if(m)parts.push({...q,x:W-p.x,vx:-q.vx})}}
c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);last=pos(e);current=[last];paths.push({p:current,m:mirror});emit(last,40,true)};c.onpointermove=e=>{if(!down)return;let p=pos(e),d=Math.hypot(p.x-last.x,p.y-last.y),n=Math.max(1,Math.ceil(d/3));for(let i=1;i<=n;i++){let q={x:last.x+(p.x-last.x)*i/n,y:last.y+(p.y-last.y)*i/n};current.push(q);if(i%3===0)emit(q,4)}last=p};c.onpointerup=e=>{if(!down)return;down=false;let s=smooth(smooth(current));current.splice(0,current.length,...s);emit(pos(e),65,true,paths.at(-1).m);last=null};
function trail(p,m){let pts=m?p.map(q=>({x:W-q.x,y:q.y})):p;if(!pts.length)return;for(let L of [[24,'#ff00990b',34],[12,'#ff18a82b',23],[6,'#ff31b7aa',15],[2,'#ffe7f8',7]]){x.lineWidth=L[0];x.strokeStyle=L[1];x.shadowColor='#ff0ca7';x.shadowBlur=L[2];x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)x.lineTo(pts[i].x,pts[i].y);x.stroke()}}
function draw(){x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';for(let a of paths){trail(a.p,false);if(a.m)trail(a.p,true)}for(let p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy=p.vy*.98+.01;p.life--;let a=Math.min(1,p.life/18);x.globalAlpha=a;x.fillStyle=`hsl(${p.h} 100% 68%)`;x.shadowColor=x.fillStyle;x.shadowBlur=13;x.beginPath();x.arc(p.x,p.y,p.size,0,7);x.fill()}parts=parts.filter(p=>p.life>0);x.globalAlpha=1;x.globalCompositeOperation='source-over';requestAnimationFrame(draw)}draw();
mode.onclick=()=>{mirror=!mirror;mode.textContent=mirror?'镜像开启':'镜像关闭';mode.classList.toggle('on',mirror);axis.hidden=!mirror;hint.textContent=mirror?'按住并拖拽 · 自动镜像绘制':'按住并拖拽 · 自由单边绘制'};document.querySelector('#clear').onclick=()=>{paths=[];parts=[]};
</script></body></html>
